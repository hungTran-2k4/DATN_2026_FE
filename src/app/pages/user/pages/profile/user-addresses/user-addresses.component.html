<div class="h-full font-inter">
  <div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-6">
    <div>
      <h2 class="text-xl font-medium text-gray-900">Địa Chỉ Của Tôi</h2>
      <p class="text-gray-500 text-sm mt-1">Quản lý địa chỉ nhận hàng của bạn</p>
    </div>
    <button (click)="openNewAddress()" class="bg-user-primary text-white hover:bg-opacity-90 px-4 py-2 rounded-sm text-sm font-medium flex items-center gap-2 shadow-sm">
      <i class="pi pi-plus"></i> Thêm địa chỉ mới
    </button>
  </div>

  <div *ngIf="savedAddresses.length === 0" class="text-center py-12">
    <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="pi pi-map-marker text-2xl text-gray-400"></i>
    </div>
    <p class="text-gray-500 font-medium">Bạn chưa có địa chỉ nào.</p>
  </div>

  <div class="flex flex-col gap-4">
    <div *ngFor="let addr of savedAddresses" class="border border-gray-100 rounded-sm p-5 hover:shadow-sm transition-shadow bg-white flex flex-col md:flex-row md:items-start justify-between gap-4">
      
      <div class="flex-1">
        <div class="flex items-center gap-3 mb-2">
          <span class="font-bold text-gray-900">{{addr.name}}</span>
          <span class="text-gray-300">|</span>
          <span class="text-gray-600 text-sm">{{addr.phone}}</span>
          <span *ngIf="addr.isDefault" class="text-[10px] font-bold text-user-primary bg-emerald-50 px-2 py-0.5 border border-emerald-100 uppercase">Mặc định</span>
        </div>
        <p class="text-sm text-gray-600 leading-relaxed max-w-2xl">{{addr.address}}</p>
      </div>

      <div class="flex flex-col items-end gap-3 shrink-0">
        <div class="flex items-center gap-3 text-sm">
          <button (click)="openEditAddress(addr)" class="text-blue-600 hover:underline">Cập nhật</button>
          <button *ngIf="!addr.isDefault" (click)="deleteAddress(addr.id)" class="text-gray-500 hover:text-red-500 hover:underline">Xóa</button>
        </div>
        <button *ngIf="!addr.isDefault" (click)="setDefaultAddress(addr.id)" class="border border-gray-300 px-3 py-1.5 rounded-sm text-sm hover:bg-gray-50 transition-colors">
          Thiết lập mặc định
        </button>
      </div>
      
    </div>
  </div>

  <!-- Dialog Thêm/Sửa Địa chỉ -->
  <p-dialog [(visible)]="showAddressDialog" 
            [modal]="true" 
            [style]="{width: '90vw', maxWidth: '600px'}" 
            [header]="isEditing ? 'Cập Nhật Địa Chỉ' : 'Địa Chỉ Mới'"
            styleClass="p-fluid font-inter">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
        <div class="flex flex-col gap-1">
          <label class="text-sm text-gray-600">Họ và tên</label>
          <input pInputText type="text" [(ngModel)]="newAddress.name" placeholder="Họ và tên" class="shadow-none focus:border-user-primary border-gray-300" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm text-gray-600">Số điện thoại</label>
          <input pInputText type="text" [(ngModel)]="newAddress.phone" placeholder="Số điện thoại" class="shadow-none focus:border-user-primary border-gray-300" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div class="flex flex-col gap-1">
          <label class="text-sm text-gray-600">Tỉnh/Thành phố</label>
          <p-dropdown [options]="provinces" [(ngModel)]="newAddress.province" optionLabel="name" [filter]="true" filterBy="name" placeholder="Chọn Tỉnh/Thành phố" (onChange)="onProvinceChange()" appendTo="body"></p-dropdown>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm text-gray-600">Quận/Huyện</label>
          <p-dropdown [options]="districts" [(ngModel)]="newAddress.district" optionLabel="name" [filter]="true" filterBy="name" placeholder="Chọn Quận/Huyện" (onChange)="onDistrictChange()" [disabled]="!newAddress.province" appendTo="body"></p-dropdown>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm text-gray-600">Phường/Xã</label>
          <p-dropdown [options]="wards" [(ngModel)]="newAddress.ward" optionLabel="name" [filter]="true" filterBy="name" placeholder="Chọn Phường/Xã" [disabled]="!newAddress.district" appendTo="body"></p-dropdown>
        </div>
      </div>

      <div class="flex flex-col gap-1 mt-4">
        <label class="text-sm text-gray-600">Địa chỉ cụ thể</label>
        <input pInputText type="text" [(ngModel)]="newAddress.street" placeholder="Số nhà, tên đường..." class="shadow-none focus:border-user-primary border-gray-300" />
      </div>

      <ng-template pTemplate="footer">
        <button pButton label="Trở lại" class="p-button-text p-button-secondary" (click)="showAddressDialog = false"></button>
        <button pButton label="Hoàn thành" class="bg-user-primary border-user-primary hover:bg-user-primary-hover hover:border-user-primary-hover px-6" [loading]="isSaving" (click)="saveAddress()"></button>
      </ng-template>
  </p-dialog>
</div>
